name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Generate derived data (prebuild)
        run: npm run prebuild

      - name: Verify checked-in generators (--check)
        run: |
          node scripts/generate-registry-json.mjs --check
          node scripts/generate-docs-json.mjs --check
          node scripts/generate-readme.mjs --check
          node scripts/generate-icon-components.mjs --check

      - name: Build library (tsup)
        run: npm run build:lib

      - name: Build icons package (tsup)
        run: npm --prefix packages/icons run build

      - name: Run component integrity test suite
        run: npm test

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint

      - name: Package lint (publint)
        run: |
          npx --no-install publint --strict
          npx --no-install publint --strict packages/icons

      - name: Type resolution check (attw)
        # node16 profile: engines field is >=20; node10 simulation false-positives
        # on dotted CSS subpaths (e.g. ./high-contrast.css) while all living resolvers pass
        run: |
          npx --no-install attw --pack . --profile node16
          npx --no-install attw --pack packages/icons --profile node16

      - name: Props coverage report
        run: node scripts/props-coverage.mjs

      - name: Link scan
        run: node scripts/scan-links.mjs

      - name: Smoke test create-bigbull-app
        run: |
          node packages/create-app/bin/create.js --help
          node packages/create-app/bin/create.js --no-install /tmp/smoke-app
          test -f /tmp/smoke-app/package.json
          rm -rf /tmp/smoke-app

      - name: Build Next.js documentation site
        # `npx next build` skips the npm prebuild hook: generators already ran above.
        run: npx next build

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright DOM tests
        run: BIGBULL_REQUIRE_DOM=1 node --test tests/dom.test.mjs

      - name: Accessibility scan
        run: |
          trap 'kill $(cat /tmp/next-start.pid 2>/dev/null) 2>/dev/null || true' EXIT
          (npm run start -- -p 3000 &>/tmp/next-start.log & echo $! > /tmp/next-start.pid)
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/next-start.log
            exit 1
          fi
          node scripts/a11y-scan.mjs

      - name: Size report
        run: node scripts/size-report.mjs

  windows-smoke:
    name: Windows smoke (paths, CRLF, scripts)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate derived data (prebuild)
        run: npm run prebuild

      - name: Run test suite
        run: npm test

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Registry + sizes generators (CRLF-safe)
        run: |
          node scripts/generate-registry-json.mjs --check
          node scripts/generate-readme.mjs --check
          node scripts/calc-sizes.mjs
