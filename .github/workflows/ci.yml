name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run component integrity test suite
        run: npm test

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint

      - name: Build library (tsup)
        run: npm run build:lib

      - name: Package lint (publint)
        run: npx --yes publint --strict

      - name: Type resolution check (attw)
        run: npx --yes @arethetypeswrong/cli --pack .

      - name: Props coverage report
        run: node scripts/props-coverage.mjs

      - name: Link scan
        run: node scripts/scan-links.mjs

      - name: Build Next.js documentation site
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Accessibility scan
        run: |
          (npm run start -- -p 3000 &>/tmp/next-start.log & echo $! > /tmp/next-start.pid)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          node scripts/a11y-scan.mjs
          kill $(cat /tmp/next-start.pid)

      - name: Visual regression manifest check
        run: node scripts/visual-regression.mjs
