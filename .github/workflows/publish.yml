name: Publish to npm

# Publishes packages to npm when a `v*` tag is pushed, or manually via dispatch.
# Each package needs its own trusted publisher on npmjs.com:
# package Settings > Publishing access > require OIDC
# (organization F0Rextasy, repository bigbullui, workflow publish.yml).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [".", "packages/icons", "packages/create-app"]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Upgrade npm for trusted publishing
        # npm < 11.5.1 cannot exchange the GitHub OIDC token, so publish 404s.
        run: npm install -g npm@11.21.3 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify git tag matches package version
        if: github.ref_type == 'tag' && matrix.package == '.'
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag v$TAG_VER does not match package.json version $PKG_VER" >&2
            exit 1
          fi

      - name: Generate derived data
        # tsc needs src/data/*.json which exist only after the generators run.
        run: npm run prebuild

      - name: Build package
        run: |
          if [ "${{ matrix.package }}" = "." ]; then
            npm run build:lib
          elif [ "${{ matrix.package }}" = "packages/icons" ]; then
            npm --prefix packages/icons run build
          fi

      - name: Package & test gates
        run: |
          npm test
          npx tsc --noEmit
          npx --no-install publint --strict "${{ matrix.package }}"
          if [ "${{ matrix.package }}" != "packages/create-app" ]; then
            npx --no-install attw --pack "${{ matrix.package }}" --profile node16
          fi

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./${{ matrix.package }}/package.json').name")
          VERSION=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already published, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.check.outputs.skip == 'false'
        # Trusted publishing via GitHub OIDC; no long-lived token involved.
        run: npm publish "./${{ matrix.package }}" --provenance --access public
