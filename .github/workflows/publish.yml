name: Publish to npm

# Runs on demand, or as a reusable workflow from Release Please. Release
# events created with GITHUB_TOKEN do not trigger workflows, so releases
# cannot start this file through the `release` event.
# Each package needs its own trusted publisher on npmjs.com:
# package Settings > Publishing access > require OIDC
# (organization F0Rextasy, repository bigbullui, workflow publish.yml).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [".", "packages/icons", "packages/create-app"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Upgrade npm for trusted publishing
        # npm < 11.5.1 cannot exchange the GitHub OIDC token, so publish 404s.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build icons package
        if: matrix.package == 'packages/icons'
        working-directory: packages/icons
        run: npx --no-install tsup

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./${{ matrix.package }}/package.json').name")
          VERSION=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already published, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.check.outputs.skip == 'false'
        # Trusted publishing via GitHub OIDC; no long-lived token involved.
        run: npm publish "./${{ matrix.package }}" --provenance --access public
